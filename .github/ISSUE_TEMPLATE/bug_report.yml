name: Bug report
description: Something is wrong or crashes
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Command or code, plus a minimal input sample if possible.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: streamio version
      placeholder: "streamio --version, or module version"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Go version / OS / arch
    validations:
      required: false
  - type: input
    id: formats
    attributes:
      label: Input → output formats
      placeholder: "e.g. parquet → json"
