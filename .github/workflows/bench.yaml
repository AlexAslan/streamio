name: Benchmark

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: bench-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark Comparison
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      # Excludes any benchmark named *_LargeScale by convention: those are opt-in-only
      # (see BenchmarkRunConvert_LargeScale's doc comment), too slow to run twice per PR here.
      - name: Resolve benchmark pattern
        id: pattern
        run: |
          list=$(go test -list='^Benchmark' ./... | grep '^Benchmark' | grep -v '_LargeScale$' | sort -u | paste -sd '|' -)
          echo "pattern=^(${list})$" >> "$GITHUB_OUTPUT"

      # Both runs happen sequentially in this job on the same runner to eliminate
      # cross-machine variance. No caching: comparing results from different runner
      # instances introduces noise that can look like a regression.
      - name: Benchmark base branch
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          go test -run='^$' -bench='${{ steps.pattern.outputs.pattern }}' -benchtime=1x -count=10 -timeout=20m ./... \
            | tee bench-base.txt

      - name: Benchmark PR HEAD
        run: |
          git checkout ${{ github.event.pull_request.head.sha }}
          go test -run='^$' -bench='${{ steps.pattern.outputs.pattern }}' -benchtime=1x -count=10 -timeout=20m ./... \
            | tee bench-head.txt

      # Renders the template by reading each piece straight from disk instead of routing it
      # through the environment (envsubst's approach): bench-base.txt/bench-head.txt now hold
      # count=10 runs of 25 benchmark cases each, easily large enough to blow past the OS's
      # ARG_MAX for a single exec's environment block, which envsubst hit outright.
      - name: Build comment body
        run: |
          benchstat bench-base.txt bench-head.txt > bench-diff.txt 2>&1 || true
          base_short="${{ github.event.pull_request.base.sha }}"
          head_short="${{ github.event.pull_request.head.sha }}"

          awk -v base="${base_short:0:8}" -v head="${head_short:0:8}" '
            /\$\{BASE_SHORT\}/ { gsub(/\$\{BASE_SHORT\}/, base) }
            /\$\{HEAD_SHORT\}/ { gsub(/\$\{HEAD_SHORT\}/, head) }
            /\$\{BENCHSTAT_OUT\}/ { while ((getline line < "bench-diff.txt") > 0) print line; next }
            /\$\{RAW_BASE\}/ { while ((getline line < "bench-base.txt") > 0) print line; next }
            /\$\{RAW_HEAD\}/ { while ((getline line < "bench-head.txt") > 0) print line; next }
            { print }
          ' .github/templates/bench-comment.md > comment-body.md

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-comment
          path: comment-body.md
          retention-days: 1
