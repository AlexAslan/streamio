name: Benchmark

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: bench-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark Comparison
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      # Excludes any benchmark named *_LargeScale by convention: those are opt-in-only
      # (see BenchmarkRunConvert_LargeScale's doc comment), too slow to run twice per PR here.
      - name: Resolve benchmark pattern
        id: pattern
        run: |
          list=$(go test -list='^Benchmark' ./... | grep '^Benchmark' | grep -v '_LargeScale$' | sort -u | paste -sd '|' -)
          echo "pattern=^(${list})$" >> "$GITHUB_OUTPUT"

      # Both runs happen sequentially in this job on the same runner to eliminate
      # cross-machine variance. No caching: comparing results from different runner
      # instances introduces noise that can look like a regression.
      #
      # BenchmarkRunConvert drives runConvert directly, which logs a "wrote <path>: N rows
      # read, ..." line to stdout on every successful conversion — real CLI behavior, not
      # something the benchmark suppresses. go test prefixes that line with the current
      # subbenchmark's own name and a tab (e.g. "BenchmarkRunConvert/json-to-json-2\twrote
      # ..."), so a plain "keep lines starting with Benchmark" filter still lets it through —
      # benchstat then chokes trying to parse it as a result line ("parsing iteration count:
      # invalid syntax"). The awk filter below instead checks the *second* tab-separated
      # field: a real result line's is always the iteration count (a bare integer); a
      # log-passthrough line's is the log text itself, whatever it says. Written to a temp
      # file (not .github/scripts/) so it survives the git checkout below switching to a
      # commit that predates this filter's own existence.
      # -count=6 is benchstat's own documented minimum sample size for a confidence interval
      # (fewer samples get a "need >= 6 samples" footnote instead of a real range) — the
      # smallest count that still gives a statistically meaningful comparison, chosen over the
      # original -count=10 to cut this job's runtime given BenchmarkRunConvert alone is 25
      # cases run twice (base and HEAD).
      - name: Write bench output filter
        run: |
          cat > /tmp/filter-bench.awk <<'AWK'
          /^(goos|goarch|pkg|cpu|PASS|FAIL|ok[[:space:]])/ { print; next }
          /^Benchmark/ {
            n = split($0, f, "\t")
            if (n >= 2 && f[2] ~ /^[[:space:]]*[0-9]+[[:space:]]*$/) print
          }
          AWK

      - name: Benchmark base branch
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          go test -run='^$' -bench='${{ steps.pattern.outputs.pattern }}' -benchtime=1x -count=6 -timeout=20m ./... \
            | tee bench-base-raw.txt \
            | awk -f /tmp/filter-bench.awk > bench-base.txt

      - name: Benchmark PR HEAD
        run: |
          git checkout ${{ github.event.pull_request.head.sha }}
          go test -run='^$' -bench='${{ steps.pattern.outputs.pattern }}' -benchtime=1x -count=6 -timeout=20m ./... \
            | tee bench-head-raw.txt \
            | awk -f /tmp/filter-bench.awk > bench-head.txt

      # Renders the template by reading benchstat's diff straight from disk instead of routing
      # it through the environment (envsubst's approach): with count=6 runs of 25 benchmark
      # cases, that output is easily large enough to blow past the OS's ARG_MAX for a single
      # exec's environment block, which envsubst hit outright. The comment itself only carries
      # the benchstat diff, not the raw per-iteration output — that output alone is large
      # enough to blow past GitHub's own comment size limit and get silently truncated
      # mid-table; the full bench-*-raw.txt files go out as a build artifact instead.
      - name: Build comment body
        run: |
          benchstat bench-base.txt bench-head.txt > bench-diff.txt 2>&1 || true
          base_short="${{ github.event.pull_request.base.sha }}"
          head_short="${{ github.event.pull_request.head.sha }}"

          awk -v base="${base_short:0:8}" -v head="${head_short:0:8}" '
            /\$\{BASE_SHORT\}/ { gsub(/\$\{BASE_SHORT\}/, base) }
            /\$\{HEAD_SHORT\}/ { gsub(/\$\{HEAD_SHORT\}/, head) }
            /\$\{BENCHSTAT_OUT\}/ { while ((getline line < "bench-diff.txt") > 0) print line; next }
            { print }
          ' .github/templates/bench-comment.md > comment-body.md

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-comment
          path: |
            comment-body.md
            bench-base-raw.txt
            bench-head-raw.txt
          retention-days: 1
