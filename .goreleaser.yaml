version: 2

before:
  hooks:
    - go mod tidy
    - scripts/third-party-notices.sh

builds:
  - id: streamio
    main: ./cmd
    binary: streamio
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w

archives:
  - id: streamio
    formats: [tar.gz]
    files:
      - LICENSE
      - THIRD_PARTY_NOTICES.md
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^test:"
      - "^docs:"
